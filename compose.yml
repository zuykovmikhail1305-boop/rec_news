services:
  db:
    image: postgres
    secrets:
      - db_password
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: rec_news
      POSTGRES_USER: rec_news
    volumes:
      - db-volume:/var/lib/postgresql
    expose:
      - 5432
    # ports:
     # - "5432:5432"

  qdrant:
    image: qdrant/qdrant
    volumes:
      - qdrant-volume:/qdrant/storage
    expose:
      - 6333

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"   # Порт для работы брокера
      - "15672:15672" # Веб-панель управления RabbitMQ (http://localhost:15672)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    ports:
      - "80:8000"
    env_file:
      - .env/backend.env
    depends_on:
      - db
      - rabbitmq
      - ml

  parser:
    build:
      context: ./services/parser
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_started
      rabbitmq:
        condition: service_started
      ml:
        condition: service_started
      parser-init:
        condition: service_completed_successfully
    env_file:
      - ./.env/parser.env

  ml:
    build:
      context: ./services/ml
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_started
      rabbitmq:
        condition: service_started
      qdrant:
        condition: service_started
      ml-init:
        condition: service_completed_successfully
    ports:
      - "8002:8002"
    env_file:
      - ./.env/ml.env
    volumes:
      - embedding-volume:/usr/src/app/models
    secrets:
      - source: ml_env
        target: /usr/src/app/.env

  ml-init:
    build:
      context: ./services/ml
      dockerfile: Dockerfile
    depends_on:
      - db
      - qdrant
    env_file:
      - ./.env/ml.env
    volumes:
      - embedding-volume:/usr/src/app/models
    secrets:
      - source: ml_env
        target: /usr/src/app/.env
    entrypoint: "uv run scripts/init_db.py && uv run scripts/migrate_to_postgres.py"

  parser-init:
    build:
      context: ./services/parser
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_started
      #rabbitmq:
        #condition: service_started
      ml-init:
        condition: service_completed_successfully
    env_file:
      - ./.env/parser.env
    entrypoint:
      - uv
      - run
      - scripts/init_db.py

secrets:
  db_password:
    file: ./.env/db_password
  ml_env:
    file: ./.env/ml.env

volumes:
  db-volume:
  embedding-volume:
  rabbitmq-data:
  qdrant-volume:
