# Весь проект в Docker. Перед первым запуском: sh docker/make_env.sh (папка .env/ из .env сервисов).
#   docker compose up -d --build      → сайт http://localhost, ML :8002, парсер :8001
services:
  db:
    image: postgres:18
    secrets:
      - db_password
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: rec_news
      POSTGRES_USER: rec_news
    volumes:
      - db-volume:/var/lib/postgresql
    expose:
      - 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rec_news -d rec_news"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.19.2
    volumes:
      - qdrant-volume:/qdrant/storage
    expose:
      - 6333

  rabbitmq:
    image: rabbitmq:3.13-management
    # порты наружу не открываются: 5672/15672 на хосте заняты dev-контейнерами services/ml/docker-compose.yml
    expose:
      - 5672
      - 15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

  # Один раз перед ML: таблицы, коллекции Qdrant, аналитика банка и пользователи демо (seed_users, без LLM).
  ml-init:
    build:
      context: ./services/ml
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
    env_file:
      - ./.env/ml.env
    volumes:
      - embedding-volume:/usr/src/app/models
    secrets:   # init_db.py и сервис ждут файл .env в корне ML
      - source: ml_env
        target: /usr/src/app/.env
    entrypoint: ["sh", "-c", "uv run scripts/init_db.py && uv run seed_users/load_users.py --no-build"]

  ml:
    build:
      context: ./services/ml
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_started
      ml-init:
        condition: service_completed_successfully
    ports:
      - "8002:8002"
    env_file:
      - ./.env/ml.env
    volumes:
      - embedding-volume:/usr/src/app/models
    secrets:   # init_db.py и сервис ждут файл .env в корне ML
      - source: ml_env
        target: /usr/src/app/.env

  parser-init:
    build:
      context: ./services/parser
    depends_on:
      db:
        condition: service_healthy
      ml-init:
        condition: service_completed_successfully
    env_file:
      - ./.env/parser.env
    entrypoint: ["uv", "run", "scripts/init_db.py"]

  parser:
    build:
      context: ./services/parser
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ml:
        condition: service_started
      parser-init:
        condition: service_completed_successfully
    env_file:
      - ./.env/parser.env

  backend:
    build:
      context: ./services/backend
    ports:
      - "80:8000"
    env_file:
      - ./.env/backend.env
    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_started

secrets:
  db_password:
    file: ./.env/db_password
  ml_env:
    file: ./.env/ml.env

volumes:
  db-volume:
  embedding-volume:
  rabbitmq-data:
  qdrant-volume:
