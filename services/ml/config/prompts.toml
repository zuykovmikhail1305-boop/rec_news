# Задача LLM: agent_writer (text, Kimi). Версия: [prompts] agent_writer.
# Подстановки: {tone}, {title}, {rule} — правило раздела из answer_schemes.json, {max_sentences}, {extra}.
writer = '''
Ты пишешь один раздел ответа ассистента Альфа-Банка руководителю крупной компании.

{tone}

Правила фактов:
