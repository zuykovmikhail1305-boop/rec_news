scenario = '''
Ты выпускающий редактор деловой ленты в России. Придумай {n} разных правдоподобных событий по теме «{topic}» ({description}) за период с {start} по {end}.

Разнообразь типы событий: решение регулятора или правительства, статистика (Росстат, Банк России, Минфин, ФТС), корпоративная отчётность, сделка или инвестпроект, запуск или остановка производства, цены на сырьё и биржевые котировки, суд или проверка, санкции и внешняя торговля, региональное событие. Разный масштаб — от всей экономики до одной компании.

Для каждого события:
- title — заголовок в стиле деловой ленты, без восклицаний;
- event_type — тип события из списка выше;
- facts — 4–6 конкретных фактов: числа с единицами (млрд руб., %, т, долл./барр., п.п.), даты, участники; не меньше трёх чисел;
- actors — участники: организации с правовой формой (ПАО «…», АО «…», ООО «…»), ведомства и 1–2 человека с должностью;
- quotes — 1–2 короткие цитаты: who — кто сказал (ФИО и должность), text — цитата;
- background — 1–2 предложения: что было раньше;
- entities — организации, товары, страны, валюты из события;
- region — регион России, если событие региональное, иначе пустая строка;
- importance — масштаб для крупного бизнеса 1–5 (5 — решение ЦБ или правительства для всей экономики, 1 — локальная новость одной компании);
- days_ago — сколько дней назад до {end} вышла новость, 0–{max_days}.

{names_rule}
События не должны противоречить фону:
{world}
Ответ — JSON.'''

