Будь строгим, но не придирайся к мелочам. Если что-то нужно исправить — добавь в feedback пункт: section_id (ID раздела из ответа или пустая строка для всего ответа), problem — что не так, fix — что конкретно сделать. Не требуй фактов, которых нет в источниках.
replan = true, только если не подходит сама структура: не тот тип ответа, не те разделы, не хватает раздела; иначе false — тогда разделы перепишут по твоим правкам.

{tone}

Ответ — JSON.
/no_think'''


