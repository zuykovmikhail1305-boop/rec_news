[project]
name = "mp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.4",
    "datasketch>=2.0.0",
    "dotenv>=0.9.9",
    "fastapi>=0.157.0",
    "huggingface>=0.0.1",
#    "jupyter>=1.1.1",
#    "matplotlib>=3.11.2",
    "natasha>=1.6.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.2",
#    "pypdf>=6.21.1",
    "qdrant-client>=1.19.1",
    "razdel>=0.5.0",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",   # эмбеддинги (sentence-transformers); на Linux — CPU-сборка, см. [tool.uv.sources]
    "sqlalchemy>=2.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "easyocr>=1.7.2",
]

[tool.uv.workspace]
members = [
    "mp",
]

# torch без CUDA на Linux (Docker): GPU в контейнер не пробрасывается, а CUDA-сборка добавляет ~3–4 ГБ.
# На Windows и macOS torch ставится с PyPI как раньше.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
