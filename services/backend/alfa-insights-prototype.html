<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Инсайты · прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#EF3124; --red-dark:#D4202C; --red-soft:#FDECEC;
  --bg:#F3F4F5; --card:#FFFFFF; --text:#0B1F35; --muted:#6D7986; --line:#E4E6E8; --line2:#EEF0F2;
  --ai:#7B4DFF; --ai-soft:#F3EEFF;
  --hyp:#B7791F; --hyp-soft:#FFF7E0; --hyp-line:#E8B53A;
  --risk:#D4202C; --risk-soft:#FDEDEE;
  --opp:#0C8A52; --opp-soft:#E6F6EE;
  --neutral:#56616E; --neutral-soft:#EEF0F2;
  --radius:16px; --radius-sm:12px;
  --fs:15px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:var(--fs);line-height:1.45}
body.detailed{--fs:16.5px}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
a{color:inherit}
.hidden{display:none!important}

/* ---------- auth ---------- */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.auth-card{background:#fff;border-radius:24px;padding:40px;width:100%;max-width:440px;box-shadow:0 8px 32px rgba(11,31,53,.06)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.brand-mark{width:32px;height:32px;border-radius:9px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.auth h1{font-size:26px;margin:28px 0 6px}
.auth p.sub{color:var(--muted);margin:0 0 24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input,.field select{width:100%;height:52px;border:1px solid var(--line);border-radius:12px;padding:0 16px;background:#F8F9FA;color:var(--text);outline:none}
.field input:focus,.field select:focus{border-color:var(--text);background:#fff}
.btn{height:48px;border-radius:12px;border:0;padding:0 20px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--red);color:#fff}
.btn-primary:hover{background:var(--red-dark)}
.btn-secondary{background:#F1F2F4;color:var(--text)}
.btn-secondary:hover{background:#E6E8EB}
.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn-sm{height:36px;padding:0 14px;font-size:14px;border-radius:10px}
.btn-block{width:100%}
.demo-users{margin-top:24px;border-top:1px solid var(--line);padding-top:18px}
.demo-users h4{margin:0 0 10px;font-size:13px;color:var(--muted);font-weight:500}
.demo-user{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.demo-user:hover{border-color:var(--text)}
.demo-user.sel{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset}
.ava{width:36px;height:36px;border-radius:50%;background:#E9ECEF;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:none}
.demo-user b{display:block;font-size:14px}
.demo-user span{font-size:12.5px;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin-top:14px}
.org{display:flex;align-items:center;gap:14px;width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:16px;margin-bottom:10px;text-align:left}
.org:hover{border-color:var(--text)}
.org .ava{border-radius:10px;background:#F1F2F4}
.org b{display:block}
.org span{font-size:13px;color:var(--muted)}
.org .count{margin-left:auto;background:var(--red-soft);color:var(--red-dark);font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:20px;white-space:nowrap}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.side .brand{padding:0 8px 22px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;text-decoration:none;color:var(--text);font-weight:500;margin-bottom:2px;cursor:pointer}
.nav a:hover{background:#F3F4F5}
.nav a.active{background:#F1F2F4;font-weight:600}
.nav svg{width:20px;height:20px;flex:none;color:#5C6773}
.nav .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11.5px;font-weight:700;border-radius:10px;padding:1px 7px}
.nav .ai-tag{font-size:10.5px;font-weight:700;color:var(--ai);background:var(--ai-soft);border-radius:6px;padding:1px 5px}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:12px}
.main{min-width:0}
.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 28px;position:sticky;top:0;z-index:20}
.menu-btn{display:none;border:0;background:none;padding:6px}
.switcher{position:relative}
.switcher-btn{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 12px;text-align:left;max-width:360px}
.switcher-btn b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.switcher-btn span{font-size:12px;color:var(--muted)}
.dropdown{position:absolute;top:calc(100% + 6px);left:0;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(11,31,53,.12);padding:6px;min-width:320px;z-index:30}
.dropdown button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:10px;border-radius:10px}
.dropdown button:hover{background:#F3F4F5}
.dropdown b{display:block;font-size:14px}
.dropdown span{font-size:12px;color:var(--muted)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.proto-pill{font-size:12px;color:var(--muted);border:1px dashed #C9CED4;border-radius:20px;padding:4px 10px;white-space:nowrap}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:#F3F4F5;display:flex;align-items:center;justify-content:center}
.user-chip{display:flex;align-items:center;gap:10px;font-size:14px}
.user-chip .ava{background:#0B1F35;color:#fff}
.content{padding:28px;max-width:1280px}
.page-title{font-size:28px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em}
.page-sub{color:var(--muted);margin:0 0 22px}
.card{background:var(--card);border-radius:var(--radius);padding:22px}
.grid{display:grid;gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border-radius:8px;padding:3px 9px;white-space:nowrap}
.chip.risk{background:var(--risk-soft);color:var(--risk)}
.chip.opp{background:var(--opp-soft);color:var(--opp)}
.chip.neutral{background:var(--neutral-soft);color:var(--neutral)}
.chip.ai{background:var(--ai-soft);color:var(--ai)}
.chip.bank{background:var(--red-soft);color:var(--red-dark)}
.chip.nobank{background:var(--hyp-soft);color:var(--hyp)}
.chip.plain{background:#F1F2F4;color:#3C4753;font-weight:500}
.chip.conf-ok{background:#E8F2FF;color:#1C5DB8}
.chip.conf-one{background:#F1F2F4;color:#56616E}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}

/* home */
.hero-insight{background:linear-gradient(0deg,#fff,#fff);border-radius:20px;padding:24px;display:grid;grid-template-columns:1fr auto;gap:20px;border:1px solid var(--line);position:relative;overflow:hidden}
.hero-insight:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--red)}
.hero-insight .kicker{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:10px}
.hero-insight h2{margin:0 0 8px;font-size:21px;line-height:1.3}
.hero-insight p{margin:0 0 14px;color:#3C4753}
.hero-side{display:flex;flex-direction:column;gap:8px;align-items:flex-end;justify-content:space-between}
.accounts{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.acc{background:#fff;border-radius:var(--radius);padding:20px}
.acc span{color:var(--muted);font-size:13px}
.acc b{display:block;font-size:22px;margin-top:6px}
.quick{display:flex;gap:10px;flex-wrap:wrap}
.quick button{background:#fff;border:0;border-radius:14px;padding:14px 18px;font-weight:600;display:flex;gap:10px;align-items:center}
.ops{width:100%;border-collapse:collapse}
.ops td{padding:12px 0;border-bottom:1px solid var(--line2);font-size:14px}
.ops td:last-child{text-align:right;font-weight:600}
.ops tr:last-child td{border-bottom:0}
.section-h{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px}
.section-h h3{margin:0;font-size:18px}

/* feed */
.feed-layout{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
.brief{background:#0B1F35;color:#fff;border-radius:20px;padding:22px 24px;margin-bottom:16px}
.brief .kicker{font-size:13px;opacity:.7;display:flex;gap:8px;align-items:center;margin-bottom:8px}
.brief p{margin:0;font-size:16.5px;line-height:1.5}
.brief .chip.ai{background:rgba(255,255,255,.12);color:#fff}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.seg{display:inline-flex;background:#E9EBEE;border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:9px;padding:7px 12px;font-size:13.5px;font-weight:500;color:#3C4753}
.seg button.on{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.filter{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:13.5px;font-weight:500}
.filter.on{background:var(--text);color:#fff;border-color:var(--text)}
.icard{background:#fff;border-radius:var(--radius);padding:20px 22px;margin-bottom:12px;cursor:pointer;border:1px solid transparent;transition:border-color .15s}
.icard:hover{border-color:#CDD2D7}
.icard .meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.icard h3{margin:0 0 6px;font-size:18px;line-height:1.32}
.icard p{margin:0;color:#3C4753}
.icard .foot{display:flex;gap:14px;align-items:center;margin-top:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.icard .prio{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
.prio-high{background:var(--red)} .prio-medium{background:#F0A400} .prio-low{background:#B8C0C8}
.icard .affects{font-size:13px;color:var(--muted);margin-top:8px}
.empty{background:#fff;border-radius:var(--radius);padding:28px;text-align:center;color:var(--muted)}
.panel h4{margin:0 0 4px;font-size:15px}
.panel .hint{font-size:13px;color:var(--muted);margin:0 0 12px}
.feat{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.feat:last-child{border-bottom:0}
.feat .k{color:var(--muted);min-width:92px}
.disclaimer{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;margin-top:22px}

/* insight detail */
.detail-layout{display:grid;grid-template-columns:1fr 360px;gap:20px;align-items:start}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:500;cursor:pointer;margin-bottom:14px;border:0;background:none;padding:0}
.d-head h1{font-size:26px;line-height:1.25;margin:10px 0 6px;letter-spacing:-.01em}
.d-head .date{color:var(--muted);font-size:13.5px}
.layer{border-radius:var(--radius-sm);padding:16px 18px;margin-top:14px;position:relative}
.layer .lh{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px}
.layer .q{font-size:13px;color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0;margin-left:auto}
.layer p{margin:0}
.layer.fact{background:#F5F6F7}
.layer.fact .lh{color:#3C4753}
.layer.bank{background:#fff;border:1px solid var(--line);border-left:4px solid var(--red)}
.layer.bank .lh{color:var(--red-dark)}
.layer.nobank{background:var(--hyp-soft);border:1px solid #F3DDA0}
.layer.nobank .lh{color:var(--hyp)}
.layer.ai{background:var(--ai-soft)}
.layer.ai .lh{color:var(--ai)}
.layer.hyp{background:#fff;border:1.5px dashed var(--hyp-line)}
.layer.hyp .lh{color:var(--hyp)}
.cite{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;border-radius:5px;background:#E2E5E9;font-size:11px;font-weight:700;color:#3C4753;margin-left:3px;vertical-align:2px;cursor:pointer;padding:0 4px}
.cite:hover{background:var(--text);color:#fff}
.quote{font-size:13.5px;color:#3C4753;border-left:3px solid #D5D9DE;padding:4px 0 4px 10px;margin-top:10px}
.feat-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.ro{border-radius:var(--radius-sm);padding:16px 18px;background:#fff;border:1px solid var(--line)}
.ro h4{margin:0 0 8px;display:flex;align-items:center;gap:8px;font-size:15px}
.ro ul{margin:0;padding-left:18px}
.ro li{margin:5px 0}
.ro.risk h4{color:var(--risk)} .ro.opp h4{color:var(--opp)}
.actions{background:#fff;border-radius:var(--radius-sm);padding:16px 18px;margin-top:14px;border:1px solid var(--line)}
.actions h4{margin:0 0 10px;font-size:15px}
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.check input{margin-top:3px;accent-color:var(--red);width:16px;height:16px}
.offer{display:flex;gap:16px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--radius-sm);padding:16px 18px;margin-top:14px}
.offer .tag{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.offer b{display:block;margin:2px 0}
.offer span{font-size:13.5px;color:var(--muted)}
.offer .btn{margin-left:auto;flex:none}
.basis{background:#fff;border-radius:var(--radius-sm);padding:16px 18px;margin-top:14px;border:1px solid var(--line)}
.basis h4{margin:0 0 6px;font-size:15px}
.src{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2)}
.src:last-of-type{border-bottom:0}
.src .n{width:22px;height:22px;border-radius:6px;background:#E2E5E9;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.src b{font-size:14px}
.src .tier{font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;margin-left:6px}
.t-A{background:#E6F6EE;color:var(--opp)} .t-B{background:#E8F2FF;color:#1C5DB8} .t-C{background:var(--hyp-soft);color:var(--hyp)} .t-D{background:#F1F2F4;color:#56616E} .t-R{background:var(--red-soft);color:var(--red-dark)}
.src .qt{font-size:13px;color:#3C4753;margin-top:4px}
.src .lnk{font-size:13px;color:#1C5DB8;text-decoration:none;font-weight:500}
.feedback{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:18px}
.feedback .lbl{color:var(--muted);font-size:14px;margin-right:4px}
.fb{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:500}
.fb.on{background:var(--text);color:#fff;border-color:var(--text)}

/* chat */
.chat{background:#fff;border-radius:var(--radius);display:flex;flex-direction:column;position:sticky;top:88px;max-height:calc(100vh - 108px)}
.chat-h{padding:16px 18px;border-bottom:1px solid var(--line2)}
.chat-h b{display:flex;align-items:center;gap:8px}
.chat-h span{font-size:12.5px;color:var(--muted)}
.chat-body{padding:14px 16px;overflow:auto;flex:1;min-height:200px}
.msg{margin-bottom:12px;max-width:92%;font-size:14px}
.msg.me{margin-left:auto;background:#0B1F35;color:#fff;border-radius:14px 14px 4px 14px;padding:10px 12px}
.msg.bot{background:#F5F6F7;border-radius:14px 14px 14px 4px;padding:12px}
.msg.bot .ml{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin:8px 0 3px}
.msg.bot .ml:first-child{margin-top:0}
.msg.bot .ml.f{color:#3C4753} .msg.bot .ml.b{color:var(--red-dark)} .msg.bot .ml.a{color:var(--ai)} .msg.bot .ml.h{color:var(--hyp)}
.msg.bot .dis{font-size:11.5px;color:var(--muted);margin-top:8px;border-top:1px solid #E4E6E8;padding-top:6px}
.sugg{display:flex;flex-direction:column;gap:6px;padding:0 16px 10px}
.sugg button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:13px;text-align:left}
.sugg button:hover{border-color:var(--text)}
.chat-in{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line2)}
.chat-in input{flex:1;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#F8F9FA;outline:none}
.chat-in button{width:42px;height:42px;border-radius:10px;border:0;background:var(--red);color:#fff}
.typing{display:inline-flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:#9AA4AE;animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3}40%{opacity:1}}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(11,31,53,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:20px;max-width:720px;width:100%;max-height:88vh;overflow:auto;padding:26px}
.modal h2{margin:0 0 4px;font-size:21px}
.modal .sub{color:var(--muted);margin:0 0 18px;font-size:14px}
.step{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:10px 0;position:relative}
.step .num{width:28px;height:28px;border-radius:50%;background:#F1F2F4;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700}
.step.ok .num{background:var(--opp-soft);color:var(--opp)}
.step.warn .num{background:var(--hyp-soft);color:var(--hyp)}
.step b{display:block;font-size:14.5px}
.step code{font-size:12.5px;background:#F5F6F7;border-radius:6px;padding:2px 6px;color:#3C4753}
.step .d{font-size:13.5px;color:#3C4753;margin-top:3px}
.step .m{font-size:12px;color:var(--muted);margin-top:3px}

/* sources page */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--text);border-color:var(--red);font-weight:600}
.tbl{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--radius);overflow:hidden}
.tbl th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:600;padding:12px 16px;border-bottom:1px solid var(--line);background:#FAFBFB}
.tbl td{padding:13px 16px;border-bottom:1px solid var(--line2);font-size:14px;vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.status-ok{color:var(--opp);font-weight:600;font-size:13px}
.ingest{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.pipe{margin-top:14px}
.pipe .ps{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:14px;color:var(--muted)}
.pipe .ps .ic{width:20px;height:20px;border-radius:50%;border:2px solid #D5D9DE;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px}
.pipe .ps.run{color:var(--text);font-weight:600}
.pipe .ps.run .ic{border-color:var(--red);border-top-color:transparent;animation:spin .8s linear infinite}
.pipe .ps.done{color:var(--text)}
.pipe .ps.done .ic{border-color:var(--opp);background:var(--opp);color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
.result{margin-top:14px;border-radius:14px;background:#F5F6F7;padding:16px}
.result .kv{display:flex;justify-content:space-between;font-size:14px;padding:4px 0}

/* settings */

const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function roleFor(cid){ if(S.roleOverride[cid]) return S.roleOverride[cid]; const l=S.user.companies.find(x=>x.id===cid); return l?l.role:'cfo'; }
function currentRole(){ return S.company==='group' ? roleFor(S.user.companies[0].id) : roleFor(S.company); }
function companyIds(){ return S.company==='group' ? S.user.companies.map(c=>c.id) : [S.company]; }

function score(ins, role){
  const pw={high:6, medium:3, low:1}[ins.prio];
  const ev=EVENTS[ins.e];
  const rb=(ROLES[role].boost[ev.topic]||0);
  const fb=S.fb[ins.id]==='no'?-10:S.fb[ins.id]==='yes'?1:0;
  return pw+rb*1.5+fb;
}
function feed(){
  const ids=companyIds();
  let list=INSIGHTS.filter(i=>ids.includes(i.c) && !S.muted[EVENTS[i.e].topic]);
  if(S.company==='group'){
    const byEv={};
    list.forEach(i=>{ const r=roleFor(i.c); const sc=score(i,r);
      if(!byEv[i.e] || sc>byEv[i.e].sc){ byEv[i.e]={i, sc, also:(byEv[i.e]?byEv[i.e].also:[])}; }
      byEv[i.e].also = Array.from(new Set([...(byEv[i.e].also||[]), i.c])); });
    return Object.values(byEv).sort((a,b)=>b.sc-a.sc).map(x=>({...x.i, affects:x.also}));
  }
  const r=currentRole();
  return list.map(i=>({...i, sc:score(i,r)})).sort((a,b)=>b.sc-a.sc);
}
function filtered(){
  return feed().filter(i=>{
    if(S.filter==='risk') return i.impact==='risk';
    if(S.filter==='opp') return i.impact==='opp';
    if(S.filter==='bank') return !!EVENTS[i.e].bank;
    return true; });
}

function answer(i, q){
  const ev=EVENTS[i.e]; const ql=q.toLowerCase(); const dis='<div class="dis">Не является инвестиционной рекомендацией.</div>';
  if(/источник|оригинал|откуда/.test(ql)){
    return `<div class="ml f">Факт</div>${ev.sources.map((s,k)=>`[${k+1}] ${esc(s.n)} (уровень ${s.tier}): ${esc(s.q)}`).join('<br>')}`+(ev.bank?`<div class="ml b">Альфа Ресерч</div>«${esc(ev.bank.doc)}», ${ev.bank.date}`:`<div class="ml b">Альфа Ресерч</div>Материалов банка по этому событию нет.`);
  }
  if(/стоит ли|купить|продать|рефинанс|выгодно ли/.test(ql)){
    return `<div class="ml a">AI</div>Я не даю прямых рекомендаций о сделках. Для решения важны: доля долга с плавающей ставкой, срок до погашения, стоимость досрочного погашения и ваш сценарий по ставке.`+(ev.bank?`<div class="ml b">Позиция банка</div>${esc(ev.bank.text)}`:'')+`<div class="ml a">Следующий шаг</div>Обсудить расчёт с вашим менеджером в банке.`+dis;
  }
  if(/компани|группы|другой/.test(ql)){
    const other=S.user.companies.map(c=>c.id).filter(id=>id!==i.c);
    if(!other.length) return `<div class="ml a">AI</div>У вас доступ только к ${esc(COMPANIES[i.c].name)}.`;
    const oi=INSIGHTS.find(x=>x.c===other[0] && x.e===i.e);
    if(!oi) return `<div class="ml a">AI</div>Для ${esc(COMPANIES[other[0]].name)} это событие не прошло порог значимости: в профиле компании нет признаков, через которые оно влияет на бизнес.`;
    return `<div class="ml a">AI · ${esc(COMPANIES[oi.c].name)}</div><b>${esc(oi.h)}</b><br>${esc(oi.t)}<br><a href="#" data-open="${oi.id}" style="color:#1C5DB8">Открыть карточку →</a>`+dis;
  }
  if(/если|сценари|снизят|повыс|через/.test(ql)){
    return `<div class="ml h">Гипотеза</div>${esc(i.hyp)}<div class="ml a">AI</div>Это условный сценарий модели на основе текущих фактов${ev.bank?' и позиции банка':''}, а не прогноз. Для точной оценки нужен расчёт по вашим кредитным договорам и бюджету.`+dis;
  }
  if(/банк|думает|позиц/.test(ql)){
    return ev.bank?`<div class="ml b">Позиция Альфа-Банка</div>${esc(ev.bank.text)}<br><span style="color:var(--muted);font-size:12.5px">«${esc(ev.bank.doc)}», ${ev.bank.date}</span>`:`<div class="ml b">Позиция Альфа-Банка</div>Аналитики банка по этому событию нет. Всё, что я могу сказать, будет выводом AI по внешним источникам.`;
  }
  return `<div class="ml a">AI</div>В материалах по этому событию нет прямого ответа на вопрос. Могу показать, что известно из фактов, или передать вопрос менеджеру.`+dis;
}
function ask(q){
  const i=INSIGHTS.find(x=>x.id===S.insightId); if(!q.trim()) return;
  (S.chat[i.id]=S.chat[i.id]||[]).push({me:true,t:q}); render();
  const cb=$('#cb'); cb.insertAdjacentHTML('beforeend','<div class="msg bot" id="tp"><span class="typing"><i></i><i></i><i></i></span></div>'); cb.scrollTop=cb.scrollHeight;
  setTimeout(()=>{ S.chat[i.id].push({html:answer(i,q)}); render(); const c=$('#cb'); if(c) c.scrollTop=c.scrollHeight; },900);
}

  return `<h1 class="page-title">Источники и пул материалов</h1>
  <p class="page-sub">Откуда берутся факты и позиция банка. Каждый вывод в инсайте ссылается на материал отсюда.</p>
  <div class="ingest">
    <div class="card"><h3 style="margin:0 0 4px;font-size:17px">Разобрать новость по ссылке</h3><p class="page-sub" style="margin:0 0 12px;font-size:14px">Покажем весь путь: факты → цитаты → ваши компании → инсайт</p>
      <div class="row" style="flex-wrap:nowrap"><input id="url" placeholder="https://… ссылка на новость" style="flex:1;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#F8F9FA;min-width:0"><button class="btn btn-primary btn-sm" style="height:44px" data-act="ingest">Разобрать</button></div>
      <div id="pipe"></div></div>
    <div class="card"><h3 style="margin:0 0 4px;font-size:17px">Добавить материал Альфа Ресерч</h3><p class="page-sub" style="margin:0 0 12px;font-size:14px">PDF обзора: текст, таблицы и графики извлекаются постранично</p>
      <label class="btn btn-secondary btn-sm" style="cursor:pointer">Выбрать PDF<input type="file" accept=".pdf" hidden data-act="pdf"></label>
      <div id="pdfres" class="note"></div></div>
  </div>
  <div class="tabs"><button class="${S.srcTab==='research'?'on':''}" data-tab="research">Альфа Ресерч · ${RESEARCH.length}</button><button class="${S.srcTab==='ext'?'on':''}" data-tab="ext">Внешние источники</button></div>
  ${S.srcTab==='research'?`<table class="tbl"><tr><th>Материал</th><th>Тема</th><th>Дата</th><th>В инсайтах</th><th>Статус</th></tr>
    ${RESEARCH.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td>${r[2]}</td><td style="white-space:nowrap">${r[1]}</td><td>${usedCount(r[0])}</td><td class="status-ok">Обработан</td></tr>`).join('')}</table>`
  :`<table class="tbl"><tr><th>Уровень</th><th>Тип</th><th>Примеры</th><th>Правило использования</th></tr>
    ${REG.map(r=>`<tr><td><span class="tier t-${r[0]}" style="font-size:12px;font-weight:700;border-radius:5px;padding:2px 8px">${r[0]}</span></td><td><b>${r[1]}</b></td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</table>`}`;
}
function runIngest(){
  const steps=['Сбор страницы и сохранение оригинала','Очистка от меню и рекламы','Поиск дублей и склейка с событием','Классификация: тип события, ОКВЭД, регион','Извлечение фактов с цитатами','Проверка цитат и чисел','Сопоставление с вашими компаниями','Поиск позиции Альфа Ресерч'];
  const el=$('#pipe'); let k=0;
  const draw=()=>{ el.innerHTML='<div class="pipe">'+steps.map((s,j)=>`<div class="ps ${j<k?'done':j===k?'run':''}"><span class="ic">${j<k?'✓':''}</span>${s}</div>`).join('')+'</div>'; };
  draw();
  const t=setInterval(()=>{ k++; draw(); if(k>=steps.length){ clearInterval(t);
    const names=companyIds().map(id=>COMPANIES[id].name).join(', ');
    el.insertAdjacentHTML('beforeend',`<div class="result">
      <div class="kv"><span>Извлечено фактов</span><b>4</b></div>
      <div class="kv"><span>Подтверждено цитатой</span><b style="color:var(--opp)">3</b></div>
      <div class="kv"><span>Отброшено</span><b style="color:var(--risk)">1 — число не найдено в тексте</b></div>
      <div class="kv"><span>Затрагивает</span><b>${esc(names)}</b></div>
      <div class="kv"><span>Позиция Альфа Ресерч</span><b style="color:var(--hyp)">не найдена → дисклеймер</b></div>
      <p class="note" style="margin:8px 0 0">Демо: в продукте здесь появляется готовый инсайт в ленте.</p></div>`); } },550);
}

/* ---------- settings ---------- */
function renderSettings(){
  const u=S.user;
  const topics=[['rate','Ставки и денежно-кредитная политика'],['commodity','Сырьевые рынки'],['demand','Потребительский спрос'],['labor','Рынок труда'],['bonds','Долговой рынок'],['logistics','Логистика'],['regulation','Регулирование и ВЭД'],['macro','Макроэкономика']];
  return `<h1 class="page-title">Настройки инсайтов</h1><p class="page-sub">Что и как вам показывать. Факты и позиция банка от этих настроек не меняются.</p>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(340px,1fr))">
  <div class="card"><h3 style="margin:0 0 6px;font-size:17px">Роль в компаниях</h3>
    ${u.companies.map(c=>`<div class="set-row"><div class="t"><b>${esc(COMPANIES[c.id].name)}</b><span>Влияет на отбор и подачу</span></div>
      <select data-role="${c.id}">${Object.entries(ROLES).map(([k,r])=>`<option value="${k}" ${roleFor(c.id)===k?'selected':''}>${r.name}</option>`).join('')}</select></div>`).join('')}
  </div>
  <div class="card"><h3 style="margin:0 0 6px;font-size:17px">Формат подачи</h3>
    <div class="set-row"><div class="t"><b>Режим</b><span>Подобран автоматически, можно изменить</span></div>
      <div class="seg"><button class="${S.mode==='compact'?'on':''}" data-mode="compact">Компактно</button><button class="${S.mode==='detailed'?'on':''}" data-mode="detailed">Подробно</button></div></div>
    <div class="set-row"><div class="t"><b>Обращение</b><span>${esc(u.call)}</span></div></div>
    <div class="set-row"><div class="t"><b>Дайджест</b><span>Push только для высокого приоритета</span></div>
      <select data-act="digest"><option ${S.digest==='push'?'selected':''} value="push">В банке + push</option><option ${S.digest==='mail'?'selected':''} value="mail">В банке + email</option><option ${S.digest==='bank'?'selected':''} value="bank">Только в банке</option></select></div>
    <p class="note">Возраст и пол используются только для обращения и плотности подачи по умолчанию. На выбор событий и выводы они не влияют.</p>
  </div>
  <div class="card"><h3 style="margin:0 0 6px;font-size:17px">Темы</h3>
    ${topics.map(([k,l])=>`<div class="set-row"><div class="t"><b>${l}</b></div><label class="toggle"><input type="checkbox" data-topic="${k}" ${S.muted[k]?'':'checked'}><span></span></label></div>`).join('')}
  </div>
  <div class="card"><h3 style="margin:0 0 6px;font-size:17px">Какие данные используются</h3>
    ${['Отрасль (ОКВЭД) и масштаб','Банковские продукты компании','Регион и ВЭД','Контрагенты по платежам (агрегированно)','Связи внутри группы компаний'].map(l=>`<div class="set-row"><div class="t"><b>${l}</b></div><label class="toggle"><input type="checkbox" checked><span></span></label></div>`).join('')}
    <p class="note">В языковую модель передаются только агрегированные признаки, без реквизитов и персональных данных.</p>
  </div></div>`;
}

function renderStub(){
  const t={acc:'Счета',pay:'Платежи',doc:'Выписки и документы',cred:'Кредиты',ved:'ВЭД'}[S.page];
  return `<h1 class="page-title">${t}</h1><p class="page-sub">Раздел интернет-банка — в прототипе не реализован</p>
  <div class="empty">Здесь стандартный функционал банка. Сервис «Инсайты» встраивается в него как отдельный раздел и виджет на главной.<br><br><button class="btn btn-primary btn-sm" data-nav="insights">Перейти к инсайтам</button></div>`;
}

/* ---------- render & events ---------- */
let modal=false;
function render(){
  document.body.classList.toggle('detailed', S.mode==='detailed' && S.screen==='app');
  const R=$('#root');
  if(S.screen==='login') R.innerHTML=renderLogin();
  else if(S.screen==='sms') R.innerHTML=renderSms();
  else if(S.screen==='orgs') R.innerHTML=renderOrgs();
  else {
    const p=S.page;
    const inner=p==='home'?renderHome():p==='insights'?renderInsights():p==='insight'?renderInsight():p==='sources'?renderSources():p==='settings'?renderSettings():renderStub();
    R.innerHTML=renderShell(inner)+(modal?traceModal():'');
  }
}
function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2200); }
function go(page){ S.page=page; modal=false; render(); window.scrollTo(0,0); }

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-nav],[data-open],[data-filter],[data-mode],[data-fb],[data-ask],[data-tab],[data-src]');
  if(!t){ const dd=$('#dd'); if(dd && !e.target.closest('.switcher')) dd.classList.add('hidden'); return; }
  const a=t.dataset;
  if(a.nav){ e.preventDefault(); $('#side')&&$('#side').classList.remove('open'); go(a.nav); return; }
  if(a.open){ e.preventDefault(); S.insightId=a.open; const ins=INSIGHTS.find(x=>x.id===a.open); if(S.company!=='group' && ins.c!==S.company) S.company=ins.c; go('insight'); return; }
  if(a.filter){ S.filter=a.filter; render(); return; }
  if(a.mode){ S.mode=a.mode; render(); return; }
  if(a.tab){ S.srcTab=a.tab; render(); return; }
  if(a.src){ const el=$('#src'+a.src); if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.style.background='#FFF7E0'; setTimeout(()=>el.style.background='',1400);} return; }
  if(a.fb){ S.fb[S.insightId]=a.fb; render();
    toast(a.fb==='yes'?'Спасибо! Будем показывать больше похожего':a.fb==='no'?'Понятно, такие события будут ниже в ленте':'Отправлено эксперту на проверку. До проверки инсайт скрыт для других'); return; }
  if(a.ask){ ask(a.ask); return; }
  switch(a.act){
    case 'pick': S.pendingUser=a.id; render(); break;
    case 'login': S.screen='sms'; render(); setTimeout(()=>$('#code')&&$('#code').focus(),50); break;
    case 'sms': S.user=USERS[S.pendingUser]; S.mode=S.user.mode; S.roleOverride={}; S.fb={}; S.chat={};
      if(S.user.companies.length>1){ S.screen='orgs'; } else { S.company=S.user.companies[0].id; S.screen='app'; S.page='home'; } render(); break;
    case 'org': S.company=a.id; S.screen='app'; S.page='home'; render(); break;
    case 'sw': $('#dd').classList.toggle('hidden'); break;
    case 'setco': S.company=a.id; if(S.page==='insight') S.page='insights'; render(); break;
    case 'logout': S.screen='login'; S.user=null; render(); break;
    case 'menu': $('#side').classList.toggle('open'); break;
    case 'trace': modal=true; render(); break;
    case 'close': if(t.classList.contains('overlay') && e.target!==t) break; modal=false; render(); break;
    case 'ask': ask($('#ci').value); break;
    case 'mgr': toast('Запрос менеджеру отправлен (демо)'); break;
    case 'share': toast('Ссылка на инсайт скопирована (демо)'); break;
    case 'ingest': runIngest(); break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.role){ S.roleOverride[t.dataset.role]=t.value; render(); toast('Роль обновлена — лента пересчитана'); }
  if(t.dataset.topic){ S.muted[t.dataset.topic]=!t.checked; }
  if(t.dataset.act==='digest'){ S.digest=t.value; }
  if(t.dataset.act==='pdf' && t.files[0]){ const r=$('#pdfres'); r.textContent='«'+t.files[0].name+'» загружен. Демо: в продукте файл разбирается постранично и появляется в списке материалов.'; }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter' && e.target.id==='ci') ask(e.target.value);
  if(e.key==='Enter' && e.target.id==='code') document.querySelector('[data-act="sms"]').click();
  if(e.key==='Escape' && modal){ modal=false; render(); }
});
render();
</script>
</body>
</html>
