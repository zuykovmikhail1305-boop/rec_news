{% extends "demo_shell.html" %}
{% block title %}Инсайт · Альфа-Бизнес{% endblock %}
{% block main %}
<main class="content" data-insight-detail data-user-id="{{ user_id }}" data-news-id="{{ news_id }}" data-poll="{{ 'true' if card_state == 'pending' else 'false' }}">
<a class="back" href="/?user_id={{ user_id|urlencode }}">← Все инсайты</a>
<div data-insight-card>{% include "insights_live_card.html" %}</div>
<p class="live-message" data-card-message role="status" aria-live="polite"></p>
<button type="button" class="btn btn-secondary btn-sm" data-retry-insights>Обновить карточку</button>
</main>{% endblock %}
{% block scripts %}<script src="/static/live-insights.js" defer></script>{% endblock %}
