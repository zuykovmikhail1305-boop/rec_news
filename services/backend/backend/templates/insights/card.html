<!-- Карточка инсайта в ленте.
     Токены: [[id]] — id инсайта (открытие карточки),
            [[chips]] — чипы «Риск/Возможность», «Аналитика банка», «Подтверждено»,
            [[title]] / [[desc]] — заголовок и описание,
            [[detail]] — блок «Событие» в подробном режиме (может быть пустым),
            [[affects]] — «Затрагивает…» (только в режиме группы),
            [[foot]] — приоритет, горизонт, тип и дата события. -->
<div class="icard" data-open="[[id]]">
  <div class="meta">[[chips]]</div>
  <h3>[[title]]</h3>
  <p>[[desc]]</p>
  [[detail]]
  [[affects]]
  <div class="foot">[[foot]]</div>
</div>
